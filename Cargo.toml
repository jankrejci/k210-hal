[package]
name = "k210-hal"
version = "0.2.0"
authors = ["The RISC-V Team <risc-v@teams.rust-embedded.org>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "Hardware Abstract Layer (HAL) support for K210, dual-core RV64GC SoC"
repository = "https://github.com/riscv-rust/k210-hal"
keywords = ["riscv", "k210", "hal"]
license = "ISC"
edition = "2021"

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]

[features]
critical-section-impl = ["dep:critical-section"]
embassy-time-driver = [
    "critical-section-impl",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
]

[dependencies]
embedded-hal = "1.0.0"
embedded-io = "0.6.1"
k210-pac = "0.2.0"
bitflags = "1.3"
critical-section = { version = "1", optional = true, features = ["restore-state-bool"] }
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
